<!-- torneo/templates/torneo/peleadores/form.html -->
{% extends 'torneo/base.html' %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 650px;">
    <div class="card-header card-header-db"><h5 class="mb-0">{{ titulo }}</h5></div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-db">Guardar</button>
            <a href="{% url 'lista_peleadores' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
